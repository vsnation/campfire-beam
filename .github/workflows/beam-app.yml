name: BEAM app

# Builds BEAM Campfire for Linux x86_64 and Windows x64 with the BEAM core
# inside the app: libbeam_core from a "BEAM core library" pre-release
# (beam-lib.yml) — no wallet-api or beam-node programs. Before packaging, each
# job runs the app's own in-process host and node against that library and
# BEAM mainnet with throwaway wallets (on Linux also through a local Tor). The
# library's SHA-256 must equal the pin in scripts/beam/core/lib/manifest.json.
# The packages and their SHA-256 are added to an app release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 1.0.0)'
        required: true
        default: '1.0.1'
      build_number:
        description: 'Build number'
        required: true
        default: '9'
      lib_tag:
        description: 'Pre-release holding the BEAM core library'
        required: true
        default: 'beam-core-7.5.14493-cf3'
      release_tag:
        description: 'App release to add the packages to (empty: artifacts only)'
        required: false
        # Empty by default: a test run must never replace a published
        # release's files. (gh drops an empty -f value, so a default here
        # would be used even when "empty" was asked for.)
        default: ''

permissions:
  contents: read

jobs:
  linux:
    # Built on 22.04 (glibc 2.35), but the prebuilt Isar library the app
    # loads needs glibc 2.38: the package runs on Ubuntu 24.04, Fedora 39,
    # Debian 13, Mint 22 and later.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          # As upstream's CI image (Dockerfile), less OpenCV: the BEAM build
          # replaces camera_linux with a stand-in (packages/camera_linux_stub).
          sudo apt-get install -y clang cmake ninja-build pkg-config lsof meson valac \
            automake libtool libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            libstdc++-12-dev ocl-icd-opencl-dev opencl-headers libclang-dev \
            libgcrypt20-dev libgirepository1.0-dev libgit2-dev libglib2.0-dev libncurses-dev \
            libssl-dev libtss2-dev zlib1g-dev

      - name: BEAM core library from ${{ inputs.lib_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/lib" && cd "$RUNNER_TEMP/lib"
          gh release download "${{ inputs.lib_tag }}" -R "$GITHUB_REPOSITORY" -p 'linux-x86_64-libbeam_core.so' -p SHA256SUMS.txt
          grep -E '[ *]linux-x86_64-libbeam_core.so$' SHA256SUMS.txt | sha256sum -c -
          want=$(python3 -c "import json;print(json.load(open('$GITHUB_WORKSPACE/scripts/beam/core/lib/manifest.json'))['linux-x86_64']['sha256'])")
          echo "$want  linux-x86_64-libbeam_core.so" | sha256sum -c -
          mv linux-x86_64-libbeam_core.so libbeam_core.so

      - name: Configure BEAM Campfire
        run: |
          cd scripts
          echo "yes" | ./build_app.sh -v "${{ inputs.version }}" -b "${{ inputs.build_number }}" -p linux -a campfire -d -s
          ./prebuild.sh

      - name: The core inside the app, live on mainnet (direct, two wallets, Tor)
        env:
          BEAM_LIB_IT: '1'
          BEAM_CORE_LIB: ${{ runner.temp }}/lib/libbeam_core.so
          BEAM_TOR_BIN: /usr/bin/tor
        run: |
          sudo apt-get install -y tor >/dev/null
          sudo systemctl stop tor || true
          flutter test test/beam/host/in_process_lib_integration_test.dart

      - name: Build
        env:
          USE_SYSTEM_SECURE_STORAGE_DEPS: '1'
        run: flutter build linux --release

      - name: Package
        run: |
          name="BEAM-Campfire-${{ inputs.version }}-linux-x86_64"
          mkdir -p dist
          cp -r build/linux/x64/release/bundle "dist/$name"
          # The core inside the app (lib/, next to the Flutter libraries).
          install -m 0644 "$RUNNER_TEMP/lib/libbeam_core.so" "dist/$name/lib/libbeam_core.so"
          ls "dist/$name/lib"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          (cd dist && sha256sum ./*.tar.gz | sed 's# \./# #')

      - uses: actions/upload-artifact@v7
        with:
          name: app-linux-x86_64
          path: dist/*.tar.gz

  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: BEAM core library from ${{ inputs.lib_tag }}
        run: |
          mkdir -p /c/lib && cd /c/lib
          gh release download "${{ inputs.lib_tag }}" -R "$GITHUB_REPOSITORY" -p 'windows-x86_64-beam_core.dll' -p SHA256SUMS.txt
          grep -E '[ *]windows-x86_64-beam_core.dll$' SHA256SUMS.txt | sha256sum -c -
          want=$(python -c "import json;print(json.load(open(r'$GITHUB_WORKSPACE/scripts/beam/core/lib/manifest.json'))['windows-x86_64']['sha256'])")
          echo "$want *windows-x86_64-beam_core.dll" | sha256sum -c -
          mv windows-x86_64-beam_core.dll beam_core.dll

      - name: Configure BEAM Campfire
        run: |
          cd scripts
          echo "yes" | ./build_app.sh -v "${{ inputs.version }}" -b "${{ inputs.build_number }}" -p windows -a campfire -d -s
          ./prebuild.sh

      # The runner user cannot create symbolic links, so link_assets.sh's links
      # are broken; copy the five asset folders instead (as upstream's build.yaml).
      - name: Replace asset symlinks with copies
        run: |
          set -euo pipefail
          for dirname in default_themes icon lottie in_app_logo_icons svg; do
            target="assets/${dirname}"
            source="asset_sources/${dirname}/campfire"
            if [ -e "$target" ] || [ -L "$target" ]; then
              cmd.exe /c rmdir "$(cygpath -w "$target")" 2>/dev/null || rm -rf "$target"
            fi
            mkdir -p "$target"
            cp -r "${source}/." "$target/"
          done

      - name: The core inside the app, live on mainnet (direct, two wallets)
        env:
          BEAM_LIB_IT: '1'
          BEAM_CORE_LIB: C:\lib\beam_core.dll
        run: flutter test test/beam/host/in_process_lib_integration_test.dart

      - name: Build secp256k1.dll
        run: dart run coinlib:build_windows

      - name: Build
        run: flutter build windows --release

      # The app (not the cores, which link it statically) needs the Visual C++
      # runtime; a fresh Windows lacks it ("MSVCP140.dll was not found").
      # Microsoft allows these files to ship next to the app (app-local).
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item (Join-Path $crt.FullName $dll) "build/windows/x64/runner/Release/"
          }
          # The core inside the app, next to the executable (static CRT).
          Copy-Item C:\lib\beam_core.dll "build/windows/x64/runner/Release/"
          Get-ChildItem build/windows/x64/runner/Release/*.dll | Select-Object Name

      - name: Package
        shell: pwsh
        run: |
          $name = "BEAM-Campfire-${{ inputs.version }}-windows-x86_64"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/windows/x64/runner/Release" "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
          Get-FileHash "dist/$name.zip" -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v7
        with:
          name: app-windows-x86_64
          path: dist/*.zip

  macos:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The plugins need the macOS 26 SDK (connectivity_plus uses
      # NWPath.isUltraConstrained): the newest Xcode on the image, 26 or later.
      - name: Xcode 26 or later
        run: |
          ls -d /Applications/Xcode*.app
          x=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [[ -n "$x" ]] || { echo "::error::No Xcode 26 or later on this runner image"; exit 1; }
          sudo xcode-select -s "$x"
          xcodebuild -version

      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: BEAM core library from ${{ inputs.lib_tag }}
        run: |
          out="$RUNNER_TEMP/out/lib-macos-arm64" && mkdir -p "$out" && cd "$out"
          gh release download "${{ inputs.lib_tag }}" -R "$GITHUB_REPOSITORY" -p 'macos-arm64-libbeam_core.dylib' -p SHA256SUMS.txt
          grep -E '[ *]macos-arm64-libbeam_core.dylib$' SHA256SUMS.txt | shasum -a 256 -c -
          want=$(python3 -c "import json;print(json.load(open('$GITHUB_WORKSPACE/scripts/beam/core/lib/manifest.json'))['macos-arm64']['sha256'])")
          echo "$want  macos-arm64-libbeam_core.dylib" | shasum -a 256 -c -
          mv macos-arm64-libbeam_core.dylib libbeam_core.dylib
          echo "BEAM_CORE_LIB_OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Configure BEAM Campfire
        run: |
          cd scripts
          echo "yes" | ./build_app.sh -v "${{ inputs.version }}" -b "${{ inputs.build_number }}" -p macos -a campfire -d
          ./prebuild.sh

      # The live core test runs in the Linux and Windows jobs (and on the
      # maintainer's Mac): here `flutter test` would build the native assets a
      # second time, which the runner's install_name_tool refuses.
      - name: Build
        run: flutter build macos --release

      # As scripts/beam/release/build_macos_dmg.sh: strip, sign ad hoc without
      # the sandbox, put the pinned core in Frameworks, check, package.
      - name: Package
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/BEAM Campfire.app"
          ENT=scripts/beam/release/campfire_beam_unsandboxed.entitlements
          EXE="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          LIB="$APP/Contents/Frameworks/libbeam_core.dylib"
          PIN=$(grep -A1 "'macos-arm64':" lib/wallets/beam/host/beam_core_location.dart | grep -o '[0-9a-f]\{64\}' | sed -n 1p)
          links_before="$(otool -L "$EXE" | tail -n +2)"
          rm -f "$LIB"
          while IFS= read -r -d '' f; do
            if [[ "$(file -b "$f")" == Mach-O* ]]; then strip -S "$f" 2>/dev/null || true; fi
          done < <(find "$APP/Contents/MacOS" "$APP/Contents/Frameworks" -type f -print0)
          codesign --force --deep --sign - --entitlements "$ENT" "$APP"
          scripts/beam/core/lib/stage_lib.sh macos "$APP/Contents/Frameworks"
          [[ "$(shasum -a 256 "$LIB" | cut -d' ' -f1)" == "$PIN" ]] || { echo "libbeam_core.dylib is not the app's pin"; exit 1; }
          codesign --force --sign - --entitlements "$ENT" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          [[ "$(otool -L "$EXE" | tail -n +2)" == "$links_before" ]] || { echo "linked libraries changed"; exit 1; }
          found="$(find "$APP" -type f \( -name wallet-api -o -name beam-node -o -name beam-wallet \))"
          [[ -z "$found" ]] || { echo "BEAM executables in the app: $found"; exit 1; }
          # (No account-name check here: the build paths inside the app are
          # GitHub's generic /Users/runner/work, as /home/runner on Linux.)
          name="BEAM-Campfire-${{ inputs.version }}-macos-arm64"
          mkdir -p dist/stage && cp -R "$APP" dist/stage/ && ln -s /Applications dist/stage/Applications
          hdiutil create -quiet -volname "BEAM Campfire" -srcfolder dist/stage -ov -format UDZO "dist/$name.dmg"
          rm -rf dist/stage
          shasum -a 256 dist/*.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: app-macos-arm64
          path: dist/*.dmg

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      # Release signing, from encrypted repository secrets (never in the repo).
      KS_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
      KS_PROPS: ${{ secrets.ANDROID_RELEASE_KEY_PROPERTIES }}
    steps:
      - name: Release key present?
        id: key
        run: |
          if [[ -z "$KS_B64" || -z "$KS_PROPS" ]]; then
            echo "::notice::No Android release key in this repository's secrets: no APK is built."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.key.outputs.ok == 'true'

      - uses: actions/setup-java@v5
        if: steps.key.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.ok == 'true'
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: BEAM core libraries from ${{ inputs.lib_tag }}
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "${{ inputs.lib_tag }}" -R "$GITHUB_REPOSITORY" -p 'android-*-libbeam_core.so' -p SHA256SUMS.txt
          for key in android-arm64 android-x86_64; do
            f="$key-libbeam_core.so"
            grep -E "[ *]$f\$" SHA256SUMS.txt | sha256sum -c -
            want=$(python3 -c "import json;print(json.load(open('$GITHUB_WORKSPACE/scripts/beam/core/lib/manifest.json'))['$key']['sha256'])")
            echo "$want  $f" | sha256sum -c -
            mkdir -p "out/lib-$key" && mv "$f" "out/lib-$key/libbeam_core.so"
          done
          echo "BEAM_CORE_LIB_OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Release key
        if: steps.key.outputs.ok == 'true'
        run: |
          umask 077
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          # The stored properties name a local path; point storeFile at this copy.
          echo "$KS_PROPS" | grep -v '^storeFile=' > "$RUNNER_TEMP/key.properties"
          echo "storeFile=$RUNNER_TEMP/release.p12" >> "$RUNNER_TEMP/key.properties"
          echo "CAMPFIRE_ANDROID_KEY_PROPERTIES=$RUNNER_TEMP/key.properties" >> "$GITHUB_ENV"

      - name: Configure BEAM Campfire
        if: steps.key.outputs.ok == 'true'
        run: |
          cd scripts
          echo "yes" | ./build_app.sh -v "${{ inputs.version }}" -b "${{ inputs.build_number }}" -p android -a campfire -d
          ./prebuild.sh

      - name: Build
        if: steps.key.outputs.ok == 'true'
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64

      # As scripts/beam/release/build_android_apk.sh: the pinned core in each
      # APK, the version, and the release certificate.
      - name: Check and package
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          CERT=a6d8817eabd6a519f4778870540a0d9672a1ba466b447e7e06c511b0adc0e99f
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir -p dist
          for t in arm64-v8a:android-arm64:2000 x86_64:android-x86_64:4000; do
            IFS=: read -r abi key offset <<<"$t"
            APK="build/app/outputs/flutter-apk/app-$abi-release.apk"
            pin=$(grep -A1 "'$key':" lib/wallets/beam/host/beam_core_location.dart | grep -o '[0-9a-f]\{64\}' | sed -n 1p)
            [[ "$(unzip -p "$APK" "lib/$abi/libbeam_core.so" | sha256sum | cut -d' ' -f1)" == "$pin" ]] || { echo "$APK: core is not the pin"; exit 1; }
            "$BT/aapt2" dump badging "$APK" | sed -n 1p | grep -q "versionCode='$((offset + ${{ inputs.build_number }}))' versionName='${{ inputs.version }}'" || { echo "$APK: wrong version"; exit 1; }
            got=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            [[ "$got" == "$CERT" ]] || { echo "$APK is signed by $got, not the release key"; exit 1; }
            cp "$APK" "dist/BEAM-Campfire-${{ inputs.version }}-android-$( [[ $abi == arm64-v8a ]] && echo arm64 || echo x86_64 ).apk"
          done
          rm -f "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/key.properties"
          sha256sum dist/*.apk

      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.ok == 'true'
        with:
          name: app-android
          path: dist/*.apk

  publish:
    if: inputs.release_tag != ''
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Add to ${{ inputs.release_tag }}
        run: |
          cd dist
          # A release that does not exist yet is made as a DRAFT: nothing is
          # public until someone presses Publish.
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "BEAM Campfire ${{ inputs.version }} (beta)" --notes "Draft: notes to come."
          fi
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt || : > SHA256SUMS.txt
          for f in BEAM-Campfire-*; do
            grep -v " $f\$" SHA256SUMS.txt > s.tmp || true
            sha256sum "$f" >> s.tmp
            mv s.tmp SHA256SUMS.txt
          done
          sort -k2 -o SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber BEAM-Campfire-* SHA256SUMS.txt
