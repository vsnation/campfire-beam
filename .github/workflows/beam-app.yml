name: BEAM app

# Builds BEAM Campfire for Linux x86_64 and Windows x64 with the BEAM core
# inside the app: libbeam_core from a "BEAM core library" pre-release
# (beam-lib.yml) — no wallet-api or beam-node programs. Before packaging, each
# job runs the app's own in-process host and node against that library and
# BEAM mainnet with throwaway wallets (on Linux also through a local Tor). The
# library's SHA-256 must equal the pin in scripts/beam/core/lib/manifest.json.
# The packages and their SHA-256 are added to an app release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 1.0.0)'
        required: true
        default: '1.0.1'
      build_number:
        description: 'Build number'
        required: true
        default: '9'
      lib_tag:
        description: 'Pre-release holding the BEAM core library'
        required: true
        default: 'beam-core-7.5.14493-cf3'
      release_tag:
        description: 'App release to add the packages to (empty: artifacts only)'
        required: false
        default: 'beam-v1.0.1'

permissions:
  contents: read

jobs:
  linux:
    # Built on 22.04 (glibc 2.35), but the prebuilt Isar library the app
    # loads needs glibc 2.38: the package runs on Ubuntu 24.04, Fedora 39,
    # Debian 13, Mint 22 and later.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          # As upstream's CI image (Dockerfile), less OpenCV: the BEAM build
          # replaces camera_linux with a stand-in (packages/camera_linux_stub).
          sudo apt-get install -y clang cmake ninja-build pkg-config lsof meson valac \
            automake libtool libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            libstdc++-12-dev ocl-icd-opencl-dev opencl-headers libclang-dev \
            libgcrypt20-dev libgirepository1.0-dev libgit2-dev libglib2.0-dev libncurses-dev \
            libssl-dev libtss2-dev zlib1g-dev

      - name: BEAM core library from ${{ inputs.lib_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/lib" && cd "$RUNNER_TEMP/lib"
          gh release download "${{ inputs.lib_tag }}" -R "$GITHUB_REPOSITORY" -p 'linux-x86_64-libbeam_core.so' -p SHA256SUMS.txt
          grep -E '[ *]linux-x86_64-libbeam_core.so$' SHA256SUMS.txt | sha256sum -c -
          want=$(python3 -c "import json;print(json.load(open('$GITHUB_WORKSPACE/scripts/beam/core/lib/manifest.json'))['linux-x86_64']['sha256'])")
          echo "$want  linux-x86_64-libbeam_core.so" | sha256sum -c -
          mv linux-x86_64-libbeam_core.so libbeam_core.so

      - name: Configure BEAM Campfire
        run: |
          cd scripts
          echo "yes" | ./build_app.sh -v "${{ inputs.version }}" -b "${{ inputs.build_number }}" -p linux -a campfire -d -s
          ./prebuild.sh

      - name: The core inside the app, live on mainnet (direct, two wallets, Tor)
        env:
          BEAM_LIB_IT: '1'
          BEAM_CORE_LIB: ${{ runner.temp }}/lib/libbeam_core.so
          BEAM_TOR_BIN: /usr/bin/tor
        run: |
          sudo apt-get install -y tor >/dev/null
          sudo systemctl stop tor || true
          flutter test test/beam/host/in_process_lib_integration_test.dart

      - name: Build
        env:
          USE_SYSTEM_SECURE_STORAGE_DEPS: '1'
        run: flutter build linux --release

      - name: Package
        run: |
          name="BEAM-Campfire-${{ inputs.version }}-linux-x86_64"
          mkdir -p dist
          cp -r build/linux/x64/release/bundle "dist/$name"
          # The core inside the app (lib/, next to the Flutter libraries).
          install -m 0644 "$RUNNER_TEMP/lib/libbeam_core.so" "dist/$name/lib/libbeam_core.so"
          ls "dist/$name/lib"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          (cd dist && sha256sum ./*.tar.gz | sed 's# \./# #')

      - uses: actions/upload-artifact@v7
        with:
          name: app-linux-x86_64
          path: dist/*.tar.gz

  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable

      - name: BEAM core library from ${{ inputs.lib_tag }}
        run: |
          mkdir -p /c/lib && cd /c/lib
          gh release download "${{ inputs.lib_tag }}" -R "$GITHUB_REPOSITORY" -p 'windows-x86_64-beam_core.dll' -p SHA256SUMS.txt
          grep -E '[ *]windows-x86_64-beam_core.dll$' SHA256SUMS.txt | sha256sum -c -
          want=$(python -c "import json;print(json.load(open(r'$GITHUB_WORKSPACE/scripts/beam/core/lib/manifest.json'))['windows-x86_64']['sha256'])")
          echo "$want *windows-x86_64-beam_core.dll" | sha256sum -c -
          mv windows-x86_64-beam_core.dll beam_core.dll

      - name: Configure BEAM Campfire
        run: |
          cd scripts
          echo "yes" | ./build_app.sh -v "${{ inputs.version }}" -b "${{ inputs.build_number }}" -p windows -a campfire -d -s
          ./prebuild.sh

      # The runner user cannot create symbolic links, so link_assets.sh's links
      # are broken; copy the five asset folders instead (as upstream's build.yaml).
      - name: Replace asset symlinks with copies
        run: |
          set -euo pipefail
          for dirname in default_themes icon lottie in_app_logo_icons svg; do
            target="assets/${dirname}"
            source="asset_sources/${dirname}/campfire"
            if [ -e "$target" ] || [ -L "$target" ]; then
              cmd.exe /c rmdir "$(cygpath -w "$target")" 2>/dev/null || rm -rf "$target"
            fi
            mkdir -p "$target"
            cp -r "${source}/." "$target/"
          done

      - name: The core inside the app, live on mainnet (direct, two wallets)
        env:
          BEAM_LIB_IT: '1'
          BEAM_CORE_LIB: C:\lib\beam_core.dll
        run: flutter test test/beam/host/in_process_lib_integration_test.dart

      - name: Build secp256k1.dll
        run: dart run coinlib:build_windows

      - name: Build
        run: flutter build windows --release

      # The app (not the cores, which link it statically) needs the Visual C++
      # runtime; a fresh Windows lacks it ("MSVCP140.dll was not found").
      # Microsoft allows these files to ship next to the app (app-local).
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item (Join-Path $crt.FullName $dll) "build/windows/x64/runner/Release/"
          }
          # The core inside the app, next to the executable (static CRT).
          Copy-Item C:\lib\beam_core.dll "build/windows/x64/runner/Release/"
          Get-ChildItem build/windows/x64/runner/Release/*.dll | Select-Object Name

      - name: Package
        shell: pwsh
        run: |
          $name = "BEAM-Campfire-${{ inputs.version }}-windows-x86_64"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/windows/x64/runner/Release" "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
          Get-FileHash "dist/$name.zip" -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v7
        with:
          name: app-windows-x86_64
          path: dist/*.zip

  publish:
    if: inputs.release_tag != ''
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Add to ${{ inputs.release_tag }}
        run: |
          cd dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt
          for f in BEAM-Campfire-*; do
            grep -v " $f\$" SHA256SUMS.txt > s.tmp || true
            sha256sum "$f" >> s.tmp
            mv s.tmp SHA256SUMS.txt
          done
          sort -k2 -o SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber BEAM-Campfire-* SHA256SUMS.txt
